<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desk</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0c0c0c;
        color: #f4f4f4;
        display: grid;
        place-items: center;
      }
      main {
        width: min(40rem, calc(100% - 2.5rem));
        padding: 3rem 0 4rem;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 650;
        letter-spacing: -0.03em;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 0.9rem;
        line-height: 1.5;
        color: #c8c8c8;
      }
      ul {
        margin: 0.2rem 0 1rem;
        padding-left: 1.1rem;
        color: #c8c8c8;
        line-height: 1.5;
      }
      code {
        color: #f4f4f4;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Desk</h1>
      <p>Paper trading only. This site does not place an order.</p>
      <ul>
        <li>Shadow mode labels a decision and does not fill.</li>
        <li>Paper mode fills only against the paper broker.</li>
        <li>Risk vetoes stay in code. The page cannot turn them off.</li>
      </ul>
      <p>The Jev key stays on the judge. This host does not have it.</p>
    </main>
  </body>
</html>
